<title>台語生字簿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&display=swap">
<style>
/* 版面：一本作業簿。手機是單欄加底部分頁；平板以上分頁移到左邊，內容置中。
   淺色是綠格線的簿子紙（黑字、藍筆寫台羅、紅筆標變調），深色是黑板和粉筆。 */
:root {
  --paper: #F6FAF3;        /* 簿子紙 */
  --sheet: #FFFFFF;        /* 卡片、格子 */
  --ink: #1C2A30;          /* 藍黑墨水 */
  --ink-soft: #586970;     /* 鉛筆灰 */
  --rule: #CDE4D2;         /* 淺格線 */
  --rule-strong: #63AD7E;  /* 格線綠 */
  --green: #256F45;        /* 主要按鈕 */
  --on-green: #FFFFFF;
  --tint: #E6F3E8;         /* 選中底色 */
  --pen-blue: #1B52A4;     /* 原子筆藍：台羅 */
  --pen-red: #CF3324;      /* 紅筆：變調、更正 */
  --red-tint: #FCE9E5;
  --marker: #FFF1A8;       /* 螢光筆 */
  --shade: rgba(20, 40, 30, .42);
  --font-hanji: "Iansui", "PingFang TC", "Heiti TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --font-ui: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --nav-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13201A; --sheet: #1A2B23; --ink: #EEF3EC; --ink-soft: #A3B4AA; --rule: #2B4337; --rule-strong: #53866C;
    --green: #86D3A3; --on-green: #0E1B14; --tint: #223A2E; --pen-blue: #A3C8FF; --pen-red: #FF9787; --red-tint: #43231E;
    --marker: #5B5320; --shade: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13201A; --sheet: #1A2B23; --ink: #EEF3EC; --ink-soft: #A3B4AA; --rule: #2B4337; --rule-strong: #53866C;
  --green: #86D3A3; --on-green: #0E1B14; --tint: #223A2E; --pen-blue: #A3C8FF; --pen-red: #FF9787; --red-tint: #43231E;
  --marker: #5B5320; --shade: rgba(0, 0, 0, .6); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--font-ui); }
html.sheet-open { overflow: hidden; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--pen-blue); }
:focus-visible { outline: 2px solid var(--pen-blue); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--ink-soft); }
.hj { font-family: var(--font-hanji); }
.tl { font-family: var(--font-hanji); color: var(--pen-blue); }
.zh { color: var(--ink-soft); font-size: 14px; }
.offscreen { position: fixed; left: -999px; top: 0; opacity: 0; }

/* ---- layout ---- */
.app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(var(--nav-h) + 28px); }
.top { display: flex; align-items: baseline; gap: 10px; padding-block: 4px 12px; }
.brand { font-family: var(--font-hanji); font-size: 24px; line-height: 1.2; }
.brand-sub { font-family: var(--font-hanji); color: var(--pen-blue); font-size: 15px; }
.view { display: flex; flex-direction: column; gap: 14px; }
.view[hidden] { display: none; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--sheet);
  border-top: 1px solid var(--rule-strong); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { flex: 1; min-width: 0; height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: 0; color: var(--ink-soft); font-size: 12px; text-decoration: none; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--green); font-weight: 700; box-shadow: inset 0 3px 0 var(--green); }

/* ---- pieces ---- */
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack > section { display: flex; flex-direction: column; gap: 10px; }
.stack > section > .btn, .card > .btn:not(.block) { align-self: flex-start; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
h2 { font-size: 17px; font-weight: 700; }
h3, .section { font-size: 14px; font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; }
.note, .hint { font-size: 13.5px; color: var(--ink-soft); }
.note { border-left: 3px solid var(--rule-strong); padding-left: 10px; }
.note.ok, .hint.ok { color: var(--green); }
.note.warn { color: var(--pen-red); border-left-color: var(--pen-red); background: var(--red-tint); padding-block: 6px; }
.source { font-size: 12.5px; color: var(--ink-soft); border-top: 1px dashed var(--rule); padding-top: 10px; }
.empty { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding-block: 8px; }
.count { font-size: 13px; color: var(--ink-soft); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border-radius: 6px;
  border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); font-size: 15px; text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); font-weight: 700; }
.btn.ghost { border-color: var(--rule); }
.btn.sm { min-height: 36px; padding: 4px 10px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--pen-red); }
.btn.armed { background: var(--pen-red); border-color: var(--pen-red); color: var(--sheet); }
.btn:disabled { opacity: .5; cursor: default; }
.btn small { font-size: 11.5px; font-weight: 400; opacity: .85; }
.icon-btn { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: 6px; color: var(--ink-soft); }
.link { background: none; border: 0; padding: 0 2px; color: var(--pen-blue); text-decoration: underline; font-size: inherit; }
.chip { display: inline-flex; align-items: center; min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); font-size: 14px; }
.chip.on { background: var(--tint); border-color: var(--rule-strong); font-weight: 700; }
.modes { display: flex; flex-wrap: wrap; gap: 6px; }
.modes .chip { min-height: 40px; }
.chip.cite { border-radius: 6px; text-align: left; white-space: normal; }
.tag { display: inline-block; font-size: 12px; line-height: 1.5; padding: 0 7px; border-radius: 3px; background: var(--tint); color: var(--ink-soft); white-space: nowrap; }
.tag.ok { color: var(--green); }
.pos { display: inline-block; font-size: 12px; padding: 0 6px; margin-right: 6px; border: 1px solid var(--rule-strong); border-radius: 3px; color: var(--green); white-space: nowrap; }
.mark { display: inline-block; font: 11px/1.5 var(--font-ui); padding: 0 4px; margin-left: 4px; vertical-align: middle; border-radius: 3px; background: var(--marker); color: var(--ink); }

input[type="text"], input[type="search"], textarea { width: 100%; min-height: 44px; padding: 9px 11px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); font-size: 16px; }
textarea { resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: .75; }
label { font-size: 14px; color: var(--ink-soft); }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); min-height: 36px; }
.check input { width: 20px; height: 20px; accent-color: var(--green); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.preview { font-family: var(--font-hanji); font-size: 14px; min-height: 0; }
.form-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; }
.searchbar { display: flex; align-items: center; gap: 4px; padding-left: 12px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); color: var(--ink-soft); }
.searchbar input { border: 0; background: none; color: var(--ink); min-width: 0; flex: 1; outline-offset: -2px; }
.searchbar.small input { min-height: 40px; }
.seg-toggle { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; }
.seg-toggle button { min-height: 40px; padding: 4px 12px; background: var(--sheet); border: 0; border-left: 1px solid var(--rule-strong); font-size: 14px; white-space: nowrap; }
.seg-toggle button:first-child { border-left: 0; }
.seg-toggle button.on { background: var(--tint); font-weight: 700; }
.seg-toggle button.on.chg { background: var(--red-tint); color: var(--pen-red); }
.seg-toggle.wide { display: flex; }
.seg-toggle.wide button { flex: 1; min-height: 44px; }

/* ---- 音節格：漢字、台羅、本調›變調、音高線 ---- */
.line { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 8px; }
.seg { display: inline-flex; flex-direction: column; align-items: stretch; padding: 0; margin: 0; border: 0; background: none; color: inherit; text-align: center; border-radius: 2px; }
button.seg:active .syls { background: var(--tint); }
.seg-src { font-size: 12px; line-height: 18px; color: var(--ink-soft); white-space: nowrap; }
.syls { display: inline-flex; background: var(--sheet); border: 1px solid var(--rule-strong); }
.syls.guess { border-style: dashed; }
.syls.fixed { box-shadow: inset 0 -3px 0 var(--marker); }
.syl { display: inline-flex; flex-direction: column; align-items: center; min-width: 42px; padding: 4px 4px 2px; border-left: 1px dashed var(--rule); }
.syl:first-child { border-left: 0; }
.syl.w-start { border-left: 1px solid var(--rule-strong); }
.syl .hj { font-size: 28px; line-height: 1.2; }
.syl .tl { font-size: 15px; line-height: 1.35; white-space: nowrap; }
.tn { font-size: 12px; line-height: 1.3; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tn b { color: var(--ink); }
.tn i, .lg i { font-style: normal; font-weight: 700; color: var(--pen-red); }
.arrow { margin: 0 1px; opacity: .7; }
.syl.keep .hj, .syl.keep .tl, .lg u { text-decoration: underline; text-decoration-color: var(--pen-red); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.syl.manual .tn::after { content: "✎"; margin-left: 2px; color: var(--pen-red); }
.syl.unknown .tl { color: var(--pen-red); }
.ct { width: 28px; height: 16px; fill: none; stroke: var(--ink-soft); stroke-width: 2.2; stroke-linecap: round; }
.syl.chg .ct { stroke: var(--pen-red); }
.syl.keep .ct { stroke: var(--ink); }
.ct circle { fill: var(--ink-soft); stroke: none; }
.punct { font-family: var(--font-hanji); font-size: 24px; line-height: 34px; padding-top: 4px; color: var(--ink-soft); }
.line.cap .punct { padding-top: 22px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-soft); }
.lg .arrow { margin: 0 2px; }
.lg-box { display: inline-block; width: 14px; height: 12px; vertical-align: -1px; border: 1px solid var(--rule-strong); background: var(--sheet); }
.lg-box.dashed { border-style: dashed; }
.lg-box.marked { box-shadow: inset 0 -3px 0 var(--marker); }

.outs { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.out-row { display: flex; align-items: center; gap: 8px; padding-block: 6px; border-bottom: 1px solid var(--rule); }
.out-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.out-label { font-size: 12px; color: var(--ink-soft); }
.out-text { font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.out-text.hj { color: var(--ink); }

/* ---- lists ---- */
.entry-list, .cand-list, .ex-list, .sent-list, .tone-list, .fix-list { display: flex; flex-direction: column; }
.entry-list > li, .sent-list > li, .fix-list > li { border-bottom: 1px solid var(--rule); }
.entry-row { width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 10px 2px; background: none; border: 0; text-align: left; min-width: 0; }
.entry-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.entry-head .hj { font-size: 22px; line-height: 1.3; }
.entry-head .tl { font-size: 16px; }
.entry-def { font-size: 14px; color: var(--ink-soft); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; overflow-wrap: anywhere; }
.level { display: inline-flex; gap: 3px; margin-left: auto; }
.level i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--rule-strong); }
.level i.on { background: var(--green); border-color: var(--green); }
.ex-list { gap: 6px; }
.ex-li { display: flex; align-items: center; gap: 2px; }
.ex-li .ex { flex: 1; min-width: 0; }
.icon-btn.play { color: var(--pen-blue); flex: none; }
.icon-btn.play.busy { opacity: .45; }
.icon-btn.play.playing, .btn.play.playing { color: var(--green); background: var(--tint); }
.btn.play.busy { opacity: .6; }
mark { background: var(--marker); color: inherit; border-radius: 2px; padding: 0 1px; }
.proverb-list { display: flex; flex-direction: column; }
.proverb { display: flex; align-items: flex-start; gap: 2px; border-bottom: 1px solid var(--rule); }
.proverb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 10px 2px; background: none; border: 0; text-align: left; }
.proverb .icon-btn { margin-top: 6px; }
.proverb-hj { font-size: 20px; line-height: 1.4; overflow-wrap: anywhere; }
.proverb-tl { font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
.proverb-meaning { font-size: 14px; line-height: 1.5; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.proverb-why { font-size: 12.5px; color: var(--green); }
.intro { display: flex; flex-direction: column; gap: 12px; }
.ex { width: 100%; display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; text-align: left; background: var(--paper); border: 0; border-left: 3px solid var(--rule-strong); border-radius: 0 4px 4px 0; }
.ex .hj { font-size: 18px; line-height: 1.4; }
.ex .tl { font-size: 15px; line-height: 1.4; }
.sent { display: flex; flex-direction: column; gap: 6px; padding-block: 10px; }
.sent-main { display: flex; flex-direction: column; gap: 2px; text-align: left; background: none; border: 0; padding: 0; }
.sent-main .hj { font-size: 20px; line-height: 1.35; }
.cand-list > li { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--rule); }
.cand { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 9px 10px; background: none; border: 0; border-left: 4px solid transparent; text-align: left; }
.cand.on { background: var(--tint); border-left-color: var(--green); }
.cand-main { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.cand-main .hj { font-size: 22px; line-height: 1.25; }
.cand-main .tl { font-size: 16px; }
.cand-def { font-size: 13.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.cand-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.cand-more { min-width: 48px; min-height: 44px; font-size: 14px; }
.tone-row { display: grid; grid-template-columns: minmax(64px, auto) auto 1fr; align-items: center; gap: 6px 10px; padding-block: 6px; border-bottom: 1px solid var(--rule); }
.tone-syl { display: flex; align-items: baseline; gap: 6px; }
.tone-syl .hj { font-size: 22px; }
.tone-why { font-size: 12.5px; color: var(--ink-soft); }
.tone-why.manual { color: var(--pen-red); }
.tone-fixed { font-size: 14px; color: var(--ink-soft); }

/* ---- entry ---- */
.entry-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.entry-hanji { font-family: var(--font-hanji); font-size: 40px; line-height: 1.15; overflow-wrap: anywhere; }
.entry-tailo { font-family: var(--font-hanji); color: var(--pen-blue); font-size: 22px; line-height: 1.3; overflow-wrap: anywhere; }
.entry-tailo .num { margin-left: 10px; font-size: 15px; color: var(--ink-soft); }
.senses { display: flex; flex-direction: column; gap: 14px; counter-reset: sense; }
.senses > li { display: flex; flex-direction: column; gap: 8px; counter-increment: sense; }
.def { font-size: 16px; overflow-wrap: anywhere; }
.senses .def::before { content: counter(sense) ". "; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.rel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; }
.rel-label { font-size: 12.5px; color: var(--ink-soft); margin-right: 2px; }
.alt { display: inline-flex; align-items: baseline; gap: 4px; margin-right: 8px; }

/* ---- sheet ---- */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-panel { width: 100%; max-width: 640px; max-height: 90%; display: flex; flex-direction: column; background: var(--sheet); border-radius: 12px 12px 0 0;
  border-top: 3px solid var(--rule-strong); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 16px; border-bottom: 1px solid var(--rule); }
.sheet-head .icon-btn:first-child { margin-left: -12px; }
.sheet-title { flex: 1; min-width: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 14px 16px 22px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  max-width: calc(100% - 32px); padding: 9px 16px; border-radius: 6px; background: var(--ink); color: var(--paper); font-size: 14px; text-align: center; }

/* ---- review ---- */
.daily-word { background: none; border: 0; padding: 0; text-align: left; }
.daily .syl .hj { font-size: 36px; }
.daily .syl .tl { font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats div { display: flex; flex-direction: column-reverse; padding: 6px 8px; border-left: 3px solid var(--rule); min-width: 0; }
.stats dt { font-size: 12px; color: var(--ink-soft); }
.stats dd { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.flashcard { display: flex; flex-direction: column; gap: 14px; padding: 16px 12px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--paper); }
.fc-q { text-align: center; padding-block: 12px; }
.fc-hanji { font-family: var(--font-hanji); font-size: 48px; line-height: 1.2; overflow-wrap: anywhere; }
.fc-meaning { font-size: 24px; font-weight: 700; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade .btn { flex-direction: column; gap: 0; min-height: 56px; }
.grade .again { color: var(--pen-red); }
.grade .good { background: var(--green); border-color: var(--green); color: var(--on-green); font-weight: 700; }

/* ---- more ---- */
.tone-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tone-table th { text-align: left; font-weight: 400; font-size: 12.5px; color: var(--ink-soft); padding: 4px 6px; border-bottom: 1px solid var(--rule-strong); }
.tone-table td { padding: 5px 6px; border-bottom: 1px solid var(--rule); vertical-align: middle; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tone-table td.num { font-weight: 700; }
.tone-table .sub { display: block; font-size: 12px; white-space: normal; }
.tone-table .hj { font-size: 20px; }
.tone-table .ct { stroke: var(--ink); vertical-align: middle; }
.tone-table i { font-style: normal; font-weight: 700; color: var(--pen-red); }
.table-wrap { overflow-x: auto; }
.fix-list > li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 6px; font-size: 15px; }
.steps { display: flex; flex-direction: column; gap: 8px; padding-left: 22px; list-style: decimal; font-size: 15px; }
.steps li { padding-left: 2px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-soft); flex: none; }
.dot.on { background: var(--green); }
.dot.err { background: var(--pen-red); }
.backup { font: 12px/1.4 ui-monospace, Menlo, monospace; min-height: 96px; }

@media (max-width: 420px) {
  .fields { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .syl { min-width: 38px; }
}
@media (min-width: 900px) {
  body { padding-left: 96px; }
